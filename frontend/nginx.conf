server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing) - any path that isn't a real static
    # file falls back to index.html so deep links (e.g. /events/3) work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
