spring:
  application:
    name: seatsync-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seatsync}
    username: ${DB_USERNAME:seatsync}
    password: ${DB_PASSWORD:seatsync}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

seatsync:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-key-must-be-at-least-256-bits-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  booking:
    hold-duration-minutes: ${HOLD_DURATION_MINUTES:5}
    hold-expiry-scan-interval-ms: ${HOLD_EXPIRY_SCAN_INTERVAL_MS:30000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}
  currency: INR

logging:
  level:
    root: INFO
    com.seatsync: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
